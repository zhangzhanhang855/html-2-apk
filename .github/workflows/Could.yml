name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 将扁平化结构重构为标准的 Android Gradle 结构
      - name: Reorganize files into standard structure
        run: |
          mkdir -p app/src/main/java/com/example/app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/assets

          # 移动 assets
          if [ -d "assets" ]; then
            cp -r assets/* app/src/main/assets/
          fi

          # 移动布局 main.xml (重命名为标准的 layout 文件)
          if [ -f "main.xml" ]; then
            cp main.xml app/src/main/res/layout/main.xml
          fi

          # 移动 AndroidManifest.xml
          if [ -f "AndroidManifest.xml" ]; then
            cp AndroidManifest.xml app/src/main/
          fi

          # 移动 Java 文件到 package 对应目录
          # 如果 MainActivity.java 里声明了 package，可以自动识别或直接移入
          PACKAGE_DIR=$(grep -E "^package " MainActivity.java | head -n 1 | awk '{print $2}' | tr -d ';' | tr '.' '/')
          if [ -n "$PACKAGE_DIR" ]; then
            mkdir -p "app/src/main/java/$PACKAGE_DIR"
            cp MainActivity.java "app/src/main/java/$PACKAGE_DIR/"
          else
            cp MainActivity.java app/src/main/java/
          fi

      # 动态生成 settings.gradle 与 build.gradle
      - name: Generate Gradle configuration
        run: |
          cat << 'EOF' > settings.gradle
          rootProject.name = "WebviewApp"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace 'com.example.app' // 视 MainActivity 内的 package 而定
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

      # 安装 Gradle Wrapper 并直接编译 Debug APK
      - name: Build with Gradle
        run: |
          gradle wrapper
          ./gradlew assembleDebug

      # 上传生成的 APK 文件作为 GitHub Artifact 供下载
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
