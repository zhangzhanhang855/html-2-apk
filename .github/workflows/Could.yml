name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 直接复用 GitHub Runner 自带的 Android SDK，无需额外下载
      - name: Set up Android SDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Reorganize files into standard structure
        run: |
          mkdir -p app/src/main/java/com/example/app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/assets

          # 移动网页资源
          if [ -d "assets" ]; then
            cp -r assets/* app/src/main/assets/
          fi

          # 移动布局文件
          if [ -f "main.xml" ]; then
            cp main.xml app/src/main/res/layout/main.xml
          fi

          # 移动清单文件
          if [ -f "AndroidManifest.xml" ]; then
            cp AndroidManifest.xml app/src/main/
          fi

          # 移动 Java 文件并按 package 放置
          PACKAGE_DIR=$(grep -E "^package " MainActivity.java | head -n 1 | awk '{print $2}' | tr -d ';' | tr '.' '/')
          if [ -n "$PACKAGE_DIR" ]; then
            mkdir -p "app/src/main/java/$PACKAGE_DIR"
            cp MainActivity.java "app/src/main/java/$PACKAGE_DIR/"
          else
            cp MainActivity.java app/src/main/java/
          fi

      - name: Generate Gradle configuration
        run: |
          cat << 'EOF' > settings.gradle
          rootProject.name = "WebviewApp"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace 'com.example.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

      - name: Build with Gradle
        run: |
          gradle wrapper
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
