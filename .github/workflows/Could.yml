name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 配置 Runner 自带的 Android SDK 环境变量并自动同意许可
      - name: Set up Android SDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 重构老旧扁平目录、修复残缺代码及配置
      - name: Reorganize files into standard structure
        run: |
          rm -rf pic
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/assets

          # 1. 移动网页资源 (确保放入 assets/www)
          if [ -d "assets/www" ]; then
            cp -r assets/* app/src/main/assets/
          elif [ -d "assets" ]; then
            mkdir -p app/src/main/assets/www
            cp -r assets/* app/src/main/assets/www/
          fi

          # 2. 提取或固定包名
          PACKAGE_NAME=$(grep -E "^package " MainActivity.java 2>/dev/null | head -n 1 | awk '{print $2}' | tr -d ';' | tr -d '\r')
          if [ -z "$PACKAGE_NAME" ]; then
            PACKAGE_NAME="com.mycompany.myapp"
          fi
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV

          PACKAGE_DIR=$(echo "$PACKAGE_NAME" | tr '.' '/')
          mkdir -p "app/src/main/java/$PACKAGE_DIR"

          # 3. 动态生成语法完整、支持 JS 与返回键回退的 MainActivity.java
          cat << EOF > "app/src/main/java/$PACKAGE_DIR/MainActivity.java"
          package ${PACKAGE_NAME};

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/www/index.html");

                  setContentView(webView);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          # 4. 生成标准 AndroidManifest.xml
          cat << EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="WebviewApp"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

      # 动态生成 settings.gradle 和 build.gradle
      - name: Generate Gradle configuration
        run: |
          cat << 'EOF' > settings.gradle
          rootProject.name = "WebviewApp"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << EOF > app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace '${PACKAGE_NAME}'
              compileSdk 34

              defaultConfig {
                  applicationId '${PACKAGE_NAME}'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

      # 编译 Debug APK
      - name: Build with Gradle
        run: |
          gradle wrapper --gradle-version 8.2
          ./gradlew assembleDebug --stacktrace

      # 上传生成的 APK 文件
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
